server {
  listen 80;
  server_name _;

  # Basic security headers for static front
  add_header X-Content-Type-Options nosniff;
  add_header X-Frame-Options DENY;
  add_header Referrer-Policy strict-origin-when-cross-origin;

  # CSP: blocks inline scripts by default; your current index.html uses inline <script>
  # So we keep CSP permissive for now. For production, refactor to external JS and harden CSP.
  add_header Content-Security-Policy "default-src 'self' https: data: 'unsafe-inline' 'unsafe-eval'; img-src 'self' https: data:; connect-src 'self' http://api:8080 http://localhost:8080;";

  location /api/ {
    proxy_pass http://api:8080/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location / {
    root /usr/share/nginx/html;
    try_files $uri $uri/ /index.html;
  }
}
