services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: vitegourmand
      POSTGRES_USER: vg
      POSTGRES_PASSWORD: vgpass
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d

  mongo:
    image: mongo:7
    ports: ["27017:27017"]
    volumes:
      - mongodata:/data/db

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      PORT: 8080
      NODE_ENV: development
      DATABASE_URL: postgres://vg:vgpass@db:5432/vitegourmand
      MONGO_URL: mongodb://mongo:27017/vitegourmand
      JWT_SECRET: change_me_in_prod
      CORS_ORIGIN: http://localhost:3000
    ports: ["8080:8080"]
    depends_on: [db, mongo]

  front:
    build:
      context: .
      dockerfile: Dockerfile.front
    ports: ["3000:80"]
    depends_on: [api]

volumes:
  pgdata:
  mongodata:
